[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spacescout"
dynamic = ["version"]
description = "See what's filling your drives, then clean it up or move it to another drive."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["disk usage", "storage", "treemap", "cleanup", "wiztree", "windirstat"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Environment :: X11 Applications :: Qt",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "PySide6>=6.6",
    "psutil>=5.9",
    "Send2Trash>=1.8; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.3", "pillow>=10", "ruff>=0.5"]

[project.gui-scripts]
spacescout = "spacescout.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "spacescout.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spacescout = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]
